name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edagent_test
          POSTGRES_USER: edagent
          POSTGRES_PASSWORD: edagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt pytest pytest-asyncio httpx pytest-env

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: edagent_test
          POSTGRES_USER: edagent
          POSTGRES_PASSWORD: edagent
        run: alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v
