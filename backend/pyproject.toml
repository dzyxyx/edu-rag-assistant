[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.per-file-ignores]
"alembic/*" = ["F401"]
"app/db/models/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ENVIRONMENT=testing",
    "DATABASE_URL=postgresql+asyncpg://edagent:edagent@localhost/edagent_test",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "tests/*"]
